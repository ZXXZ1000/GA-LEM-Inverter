# =============================================================================
# FastScape 正演配置（独立于反演工具，不要和 config.ini 混淆）
#
# 使用流程：
#   1. 修改本文件中的路径和参数（每项都有中文注释）。
#   2. 如需复杂时间函数，编辑根目录的 uplift_time.py。
#   3. 终端运行：python forward_run.py
#
# 默认配置直接指向 demo 数据，可一键跑通。
# =============================================================================


[Run]
# 输出基目录。每次运行自动创建编号子目录，不会覆盖旧结果。
output_root = ./outputs/forward


[Data]
# 现今 DEM，作为 t=0 的初始地形。支持 .tif 或 .npy。
dem_path = ./demo/data/demo1/demo_dem.tif

# uplift 空间形态场（二维 mm/yr，shape 必须和 DEM 一致）。
# 不填或写 none 时使用下面的 uplift_value 作为均一隆升。
uplift_base_path = ./demo/data/demo1/demo_true_uplift.npy

# uplift 均一值（仅当 uplift_base_path 为 none 时生效），单位 mm/yr。
uplift_value = 1.0

# 河流侵蚀系数 Ksp。
# 优先用 ksp_path 指定数组（.npy / .tif），否则使用 ksp_value 标量。
ksp_value = 1.0e-5
ksp_path = none


[Model]
# 正演时长，单位年。例如 2e6 = 2 百万年。
time_total = 2e6

# 网格间距，单位 m。要和 DEM 实际像素分辨率一致。
spacing = 90

# 输出帧数（含若干个时间点 + 末帧）。值越大磁盘占用越多。
output_steps = 21

# FastScape 边界条件：fixed_value（闭合/固定）、core（开放出水口）、looped（周期）。
# 至少需要一条 fixed_value 边界；典型设置：bottom 给 core 当出水口。
boundary_left   = fixed_value
boundary_right  = fixed_value
boundary_top    = fixed_value
boundary_bottom = core

# 河流侵蚀指数 m 和坡度指数 n（SPL: E = K * A^m * S^n）。
area_exp  = 0.43
slope_exp = 1

# 山坡扩散系数（单位 m^2/yr * 100，会乘以 1e-2 进入 FastScape；与反演工具一致）。
k_diff = 1.0


[UpliftTime]
# uplift 在时间上的处理方式。四选一：
#   none    : 恒定，U(x,y,t) = uplift_base(x,y)
#   stages  : 阶段倍率，U(x,y,t) = uplift_base(x,y) * m_stage
#   python  : 用户自定义函数，编辑 uplift_time.py
#   array   : 直接给 (T,Y,X) 数组（mm/yr）
mode = none

# ---------- mode = python 时使用 ----------
# 加载这个文件里的 uplift_time(t_yr, x, y, z, params) 函数。
module_path = ./uplift_time.py
function = uplift_time
# 任意键值，会以字符串形式作为 params 传给函数。下面是默认模板用到的两个参数。
amplitude = 0.3
period_ma = 3.0

# ---------- mode = stages 时使用 ----------
# 阶段时间点（Ma），从过去到现在递减，最后必须是 0。例如：2,1,0
# stage_times_ma = 2,1,0
# 每段倍率，长度等于 stage_times_ma - 1。例如 1.5,0.7
# stage_multipliers = 1.5,0.7

# ---------- mode = array 时使用 ----------
# 一个 (T,Y,X) 数组，单位 mm/yr。
# array_path = ./demo/forward/uplift_TYX.npy
# 与数组帧数等长，单位“从 t=0 起算的累积年数”，必须严格递增。
# array_times_years = 0,5e5,1e6,1.5e6,2e6


[Rainfall]
# uniform 或 python。
mode = uniform
# uniform 时使用：FastScape 默认 runoff 因子，1.0 = 不变，>1 增大径流。
value = 1.0

# python 时使用：
# module_path = ./rainfall.py
# function = rainfall
# min = 0.1
# max = 5.0


[Output]
# 要保存哪些剥蚀字段（全部为完整 (T,Y,X) 序列）。
save_cumulative_erosion = true     # 累积剥蚀厚度 (m)，∫U dt − (z(t)−z₀)
save_mean_erosion_rate  = true     # 平均剥蚀率 (mm/yr) = cumulative_erosion / t
save_net_uplift         = true     # 净抬升 (m) = z(t) − z₀
save_topography_series  = true
save_uplift_series      = true

# 要画哪些图。
plot_history_grid    = true        # 多帧地形拼图
plot_erosion_history = true        # 区域统计随时间曲线
