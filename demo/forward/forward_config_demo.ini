# =============================================================================
# FastScape 正演 demo 配置：python uplift_time 路径
# 用法： python forward_run.py demo/forward/forward_config_demo.ini
# =============================================================================

[Run]
output_root = ../../outputs/forward

[Data]
dem_path = ../../demo/data/demo1/demo_dem.tif
uplift_base_path = ../../demo/data/demo1/demo_true_uplift.npy
uplift_value = 1.0
ksp_value = 1.0e-5
ksp_path = none

[Model]
time_total = 5e5
spacing = 90
output_steps = 11
boundary_left   = fixed_value
boundary_right  = fixed_value
boundary_top    = fixed_value
boundary_bottom = core
area_exp  = 0.43
slope_exp = 1
k_diff = 1.0

[UpliftTime]
mode = python
module_path = ./uplift_time_demo.py
function = uplift_time
amplitude = 0.4
period_ma = 0.5

[Rainfall]
mode = uniform
value = 1.0

[Output]
save_cumulative_erosion = true
save_mean_erosion_rate  = true
save_net_uplift         = true
save_topography_series  = true
save_uplift_series      = true
plot_history_grid    = true
plot_erosion_history = true
