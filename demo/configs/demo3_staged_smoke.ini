[Run]
mode = main
preset = demo3_staged_smoke

[Data]
terrain_path = ./demo/data/demo3/demo3_real_dem.tif
fault_shp_path = ./demo/data/demo3/demo3_faults.shp
study_area_shp_path = ./demo/data/demo3/demo3_study_area.shp
output_path = ./demo/outputs/demo3_main_runs

[Model]
k_sp_value = 6.92e-6
ksp_fault = 2e-5
d_diff_value = 19.2
boundary_status = fixed_value
boundary_left = fixed_value
boundary_right = fixed_value
boundary_top = fixed_value
boundary_bottom = core
area_exp = 0.42
slope_exp = 1
rainfall_factor = 1.0
time_total = 10e6
spacing = 900
initial_topography = random
initial_elevation = 0.0
initial_topography_seed = 42

[Rainfall]
mode = uniform
value = 1.0
module_path = ../../rainfall_model.py
function = rainfall
dynamic = true
min = 0.1
max = 5.0
base = 1.0

[Optimization]
scale_factor = 8
ratio = 0.5
target_crs = EPSG:32648
smooth_sigma = 2
population_size = 4
max_iterations = 3
search_strategy = staged
enable_fitness_cache = true
cross_probability = 0.7
mutation_probability = 0.08
uplift_min = 0.0
uplift_max = 1.4
uplift_precision = 0.1
n_jobs = -1
decay_rate = 1.0
min_population_size = 4
patience = 3
random_seed = 42
diversity_threshold = 2
diversity_cooldown = 2
diversity_random_fraction = 0.3
diversity_best_fraction = 0.5
diversity_terrain_fraction = 0.2
mutation_schedule = adaptive
mutation_max_multiplier = 2.5
mutation_stagnation_boost = true
mutation_stagnation_multiplier = 1.5

[UpliftHistory]
enabled = true
mode = stage_multiplier
multiplier_search_mode = bounded
multiplier_precision = 0.1
normalize_time_weighted_mean = false

[UpliftStage1]
start_ma = 10
end_ma = 6
multiplier_min = 0.3
multiplier_max = 0.8

[UpliftStage2]
start_ma = 6
end_ma = 3
multiplier_min = 0.9
multiplier_max = 1.2

[UpliftStage3]
start_ma = 3
end_ma = 0
multiplier_min = 1.3
multiplier_max = 1.8

[OptimizationStage1]
name = coarse
population_size = 4
max_iterations = 2
mutation_probability = 0.14
cross_probability = 0.75
patience = 2
min_population_size = 4

[OptimizationStage2]
name = refine
population_size = 4
max_iterations = 2
mutation_probability = 0.08
cross_probability = 0.70
patience = 2
min_population_size = 4

[OptimizationStage3]
name = verify
population_size = 6
max_iterations = 1
mutation_probability = 0.05
cross_probability = 0.65
patience = 1
min_population_size = 6

[Pecube]
enabled = auto
pecube_root = ./vendor/pecube
pecube_bin_dir = ./vendor/pecube/bin
project_dir = ./vendor/pecube/projects
dataset_name = fastscape
run_test = false
run_vtk = false
compute_loss = true
sample_observations = ./demo/data/demo3/demo3_thermo_samples_10ma.csv
spatial_grid = auto
observation_coordinate_system = geographic
observation_crs = EPSG:4326
run_every = 1
max_evaluations = 0
fail_strategy = penalty
penalty_loss = 100.0
shape = 21,21
time_steps = 4
total_time_myr = 10.0
velocity_km_per_myr = 1.0
include_uniform_velocity_field = false
thickness = 35.0
nz = 21
thermal_diffusivity = 25.0
basal_temperature = 700.0
sea_level_temperature = 15.0
lapse_rate = 6.5
heat_production = 0.0
erosional_time_scale = 0.0
save_ptt_paths = false
lon0 = 0.0
lat0 = 0.0
nskip = 4
dlon = 0.01
dlat = 0.01

[Fitness]
use_lpips = true
terrain_loss_weight = 0.35
thermo_loss_weight = 0.65
thermo_loss_scale = 5.0
thermo_sigma_min = 0.5
thermo_sigma_relative = 0.1

[Synthetic]
pattern = simple
shape = 64,64

[KSensitivity]
k_values = 4,8
pattern = simple
shape = 64,64
