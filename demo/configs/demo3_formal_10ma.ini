[Run]
mode = main
preset = demo3_formal_10ma

[Data]
terrain_path = ./demo/data/demo3/demo3_real_dem.tif
fault_shp_path = ./demo/data/demo3/demo3_faults.shp
study_area_shp_path = ./demo/data/demo3/demo3_study_area.shp
output_path = ./demo/outputs/demo3_main_runs

[Model]
k_sp_value = 6.92e-6
ksp_fault = 2e-5
d_diff_value = 19.2
boundary_status = fixed_value
boundary_left = fixed_value
boundary_right = fixed_value
boundary_top = fixed_value
boundary_bottom = core
area_exp = 0.42
slope_exp = 1
time_total = 10e6
spacing = 900

[Optimization]
scale_factor = 8
ratio = 0.5
target_crs = EPSG:32648
smooth_sigma = 2
population_size = 12
max_iterations = 18
cross_probability = 0.7
mutation_probability = 0.05
uplift_min = 0.5
uplift_max = 1.5
uplift_precision = 0.1
n_jobs = -1
decay_rate = 1.0
min_population_size = 12
patience = 18
random_seed = 42

[Pecube]
enabled = auto
pecube_root = ./vendor/pecube
pecube_bin_dir = ./vendor/pecube/bin
project_dir = ./vendor/pecube/projects
dataset_name = fastscape
run_test = true
run_vtk = false
compute_loss = true
sample_observations = ./demo/data/demo3/demo3_thermo_samples_10ma.csv
spatial_grid = auto
observation_coordinate_system = geographic
observation_crs = EPSG:4326
run_every = 1
max_evaluations = 0
fail_strategy = penalty
penalty_loss = 100.0
shape = 21,21
time_steps = 10
total_time_myr = 10.0
velocity_km_per_myr = 1.0
include_uniform_velocity_field = false
thickness = 35.0
nz = 21
thermal_diffusivity = 25.0
basal_temperature = 700.0
sea_level_temperature = 15.0
lapse_rate = 6.5
heat_production = 0.0
erosional_time_scale = 0.0
save_ptt_paths = false
lon0 = 0.0
lat0 = 0.0
dlon = 0.01
dlat = 0.01

[Fitness]
use_lpips = true
terrain_loss_weight = 1.0
thermo_loss_weight = 1.0
thermo_loss_scale = 5.0
thermo_sigma_min = 0.5
thermo_sigma_relative = 0.1

[Synthetic]
pattern = simple
shape = 64,64

[KSensitivity]
k_values = 4,8
pattern = simple
shape = 64,64
