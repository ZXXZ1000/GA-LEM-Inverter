# =============================================================================
# GA-LEM-Inverter 主配置文件
#
# 普通用户只需要改这个文件，然后运行:
#   python runner.py
#
# 默认配置使用 demo/data/demo1/demo_dem.tif，可以在刚安装后直接跑通。
# 正式研究时，优先修改 [Run] mode、[Data] 输入路径和 [Optimization] 规模。
# =============================================================================

[Run]
# mode：选择要运行的实验。
# main = 真实 DEM 主优化反演；synthetic = 合成地形验证；k_sensitivity = K/scale_factor 敏感性实验。
# pecube_coupled = FastScape 序列转 Pecube 的耦合 smoke 验证。
# demo 默认用 main，验证真实 DEM 入口能直接跑起来。
mode = main

# preset：运行预设标记，只用于诊断和 summary，不改变算法。
# demo 表示轻量演示；quick 表示快速测试；research 表示正式实验。
preset = demo

[Data]
# terrain_path：main 模式必填，输入 DEM 栅格路径，支持 .tif/.tiff/.npy。
# demo 默认指向仓库自带的 64x64 示例 DEM；正式研究时改成自己的 DEM。
terrain_path = ./demo/data/demo1/demo_dem.tif

# fault_shp_path：可选，断层线 Shapefile 路径。
# 有断层文件时会沿断层设置更高侵蚀系数；留空/none/skip 时使用均一侵蚀系数场。
fault_shp_path = none

# study_area_shp_path：可选，研究区边界 Shapefile 路径。
# 有研究区文件时会裁剪 DEM 并计算旋转角；留空/none/skip 时使用 DEM 全域且不旋转。
study_area_shp_path = none

# output_path：所有实验的输出基目录。
# 每次运行会自动新建 0001_时间戳_mode 目录，里面分 figures/arrays/metrics/logs。
# demo 默认把运行结果收在 demo/outputs/，和 demo 输入数据放在同一个 demo 文件夹下。
output_path = ./demo/outputs

[Model]
# k_sp_value：基础河流侵蚀系数，控制非断层区域的河流下切强度。
# demo 值与内置 DEM 的生成尺度匹配；正式研究需要结合区域岩性、时间尺度和文献校准。
k_sp_value = 6.92e-6

# ksp_fault：断层带侵蚀系数。
# 只有 fault_shp_path 和 study_area_shp_path 都有效时才用于断层增强；无断层 demo 会自动跳过。
ksp_fault = 2e-5

# d_diff_value：坡面扩散系数，控制坡面平滑/扩散强度。
# demo 建议保留；正式实验可做敏感性测试。
d_diff_value = 19.2

# boundary_status：Fastscape 边界条件；单值会应用到四条边。
# fixed_value = 闭合/固定高程边界，core = 开放出水口，looped = 周期边界。
# 也可以用 boundary_left/right/top/bottom 分别设置四边，顺序对应 left,right,top,bottom。
boundary_status = fixed_value

# boundary_left/right/top/bottom：可选的四边边界设置。
# 如果四项都填写，会覆盖 boundary_status。当前 demo3 建议 bottom=core，把旋转后矩阵底边作为下游出水口。
boundary_left = fixed_value
boundary_right = fixed_value
boundary_top = fixed_value
boundary_bottom = core

# area_exp：河流侵蚀定律中的汇水面积指数 m。
# 不熟悉时保留默认值。
area_exp = 0.42

# slope_exp：河流侵蚀定律中的坡度指数 n。
# 不熟悉时保留默认值。
slope_exp = 1

# time_total：总模拟时间，单位年。
# demo 用 2e6，与 0.1-1.0 mm/yr 的隆升率量级匹配；正式实验通常调到百万年至千万年量级。
time_total = 2e6

# spacing：synthetic 和 k_sensitivity 使用的网格间距，单位米。
# main 模式会优先从 DEM 读取真实像元大小。
spacing = 900

[Optimization]
# scale_factor：隆升场降维因子，也就是 K。
# 64x64 DEM 配合 8 会优化 8x8 个隆升变量；越大越快但空间细节越少。
scale_factor = 8

# ratio：main 模式 DEM 重采样比例，范围 0-1。
# demo 保持 1.0；正式大 DEM 可先设 0.25-0.5 做快速试算。
ratio = 1.0

# target_crs：目标投影坐标系。
# 输入 DEM/shapefile CRS 不一致时，程序会尝试重投影到这个坐标系。
target_crs = EPSG:32648

# smooth_sigma：DEM 平滑系数。
# 数值越大，地形细节越平滑；demo 建议保留。
smooth_sigma = 2

# population_size：遗传算法种群大小。
# staged 模式下这里作为默认/兜底值；若定义了 [OptimizationStage*]，每个 stage 会使用自己的 population_size。
# demo 用 6；正式实验建议从 30-100 逐步增加。
population_size = 6

# max_iterations：最大迭代代数。
# staged 模式下这里作为默认/兜底值；若定义了 [OptimizationStage*]，每个 stage 会使用自己的 max_iterations。
# demo 用 5；正式实验建议从 50-200 逐步增加。
max_iterations = 5

# search_strategy：GA 搜索策略。
# staged = 默认，多阶段 coarse -> refine -> verify，后一阶段继承前一阶段最优解。
# single = 单阶段搜索，只建议用于调试或极快 smoke。
search_strategy = staged

# enable_fitness_cache：是否缓存重复候选解的 fitness。
# true 可以避免重复运行 FastScape + Pecube，不改变优化结果，只减少重复计算。
enable_fitness_cache = true

# cross_probability：交叉概率，控制父代组合生成新个体的比例。
# 不熟悉时保留默认值。
cross_probability = 0.7

# mutation_probability：变异概率，控制随机扰动强度。
# 不熟悉时保留默认值。
mutation_probability = 0.05

# uplift_min：隆升率搜索下界，单位 mm/yr。
# 正式研究应按区域地质背景设置。
uplift_min = 0.1

# uplift_max：隆升率搜索上界，单位 mm/yr。
# 正式研究应按区域地质背景设置。
uplift_max = 1.0

# uplift_precision：隆升率搜索步长，单位 mm/yr。
# 例如 0.1 表示 GA 内部搜索 1..10 的整数编码，进入 FastScape 前自动还原为 0.1..1.0 mm/yr。
# 这样既避免浮点染色体造成过细搜索，又能保留 0.1 mm/yr 的物理分辨率。
uplift_precision = 0.1

# n_jobs：并行任务数。
# -1 表示使用全部 CPU 核心。Pecube 约束启用时，每个候选解会写入独立 eval 目录，可与 FastScape 一起并行。
n_jobs = -1

# decay_rate：种群衰减率。
# demo 用 1.0 表示不衰减；正式实验可设 0.95-0.98 加速后期收敛。
decay_rate = 1.0

# min_population_size：衰减后的最小种群大小，不能大于 population_size。
# demo 建议保留。
min_population_size = 6

# patience：早停耐心值，连续多少代没有改进后停止。
# demo 设为 5，避免过早停止，保证能看到完整优化曲线；正式实验可调大。
patience = 5

# random_seed：随机种子。
# demo 固定为 42，保证不同电脑首次结果相近；正式实验可换不同整数做重复实验。
random_seed = 42

# diversity_threshold：连续多少代没有改进后触发多样性注入。
# 用于跳出局部最优；值越小越激进。
diversity_threshold = 3

# diversity_cooldown：两次多样性注入之间至少间隔多少代。
diversity_cooldown = 3

# diversity_random/best/terrain_fraction：停滞后新种群的来源比例。
# random = 完全随机；best = 围绕当前最优扰动；terrain = 地形 prior。
# 三者会自动归一化，小种群下也会保证总数正确。
diversity_random_fraction = 0.3
diversity_best_fraction = 0.5
diversity_terrain_fraction = 0.2

# mutation_schedule：变异率调度。
# adaptive = 随迭代进度和停滞情况自动提高变异；fixed = 固定 mutation_probability。
mutation_schedule = adaptive

# mutation_max_multiplier：自适应变异率相对于 mutation_probability 的上限倍数。
mutation_max_multiplier = 2.5

# mutation_stagnation_boost：停滞时是否临时提高变异率。
mutation_stagnation_boost = true

# mutation_stagnation_multiplier：停滞增强倍数，最终仍受 mutation_max_multiplier 限制。
mutation_stagnation_multiplier = 1.5

[UpliftHistory]
# enabled：是否启用分阶段时间变化 uplift history。
# false = 旧行为，只优化一个静态二维平均 uplift 场。
# true = 优化一个 U_base(x,y) 空间场 + 少数阶段倍率 m_stage。
enabled = false

# mode：当前只支持 stage_multiplier。
# 科学含义是断层控制的空间形态保持一致，不同时间段只改变整体活动强弱。
mode = stage_multiplier

# stage_times_ma：从过去到现在的阶段节点，单位 Ma，必须与 [Model] time_total 对齐并以 0 结束。
# 例如 time_total=10e6 时，10,6,3,0 表示 10-6 Ma、6-3 Ma、3-0 Ma 三段。
stage_times_ma = 2,1,0

# multiplier_min/max：每个阶段倍率搜索范围。
# 实际 uplift 为 U_base(x,y) * m_stage；不是优化多个自由 uplift field。
multiplier_min = 0.5
multiplier_max = 1.5

# multiplier_precision：阶段倍率搜索步长。
multiplier_precision = 0.1

# normalize_time_weighted_mean：是否把倍率按阶段时长归一化到加权均值为 1。
# true 时 U_base 仍表示整个模拟时间窗的平均 uplift，m_stage 只表示早晚强弱变化。
normalize_time_weighted_mean = true

[OptimizationStage1]
# coarse：高变异、强探索，快速找到可行区域。
name = coarse
population_size = 4
max_iterations = 3
mutation_probability = 0.12
cross_probability = 0.75
patience = 3
min_population_size = 4

[OptimizationStage2]
# refine：继承 coarse 最优解，降低变异，在较好区域内精修。
name = refine
population_size = 4
max_iterations = 3
mutation_probability = 0.08
cross_probability = 0.70
patience = 3
min_population_size = 4

[OptimizationStage3]
# verify：保留前阶段最优，低变异验证结果稳定性。
name = verify
population_size = 6
max_iterations = 2
mutation_probability = 0.05
cross_probability = 0.65
patience = 2
min_population_size = 6

[Pecube]
# enabled：是否启用 Pecube engine。
# auto = 有 sample_observations 时启用；mode = pecube_coupled 时也会启用。
# false = 完全关闭热年代学约束，只使用地形 fitness。
enabled = auto

# pecube_root：内置 Pecube vendor 根目录。
pecube_root = ./vendor/pecube

# pecube_bin_dir：编译后的 Pecube/Test/Vtk 可执行文件目录。
# 若缺少可执行文件，先运行 bash tools/environment/build_pecube.sh。
pecube_bin_dir = ./vendor/pecube/bin

# project_dir：保留给批量 Pecube project 的运行目录；当前 runner 默认写入本次输出目录下的 pecube/PGB01。
project_dir = ./vendor/pecube/projects

# dataset_name：写入 Pecube data/<dataset_name>/ 的数据集名称。
dataset_name = fastscape

# run_test：运行 Pecube 前是否先执行 Test 检查 Pecube.in。
# false = 默认优化搜索设置，避免 Test 为每个候选解写出 VTK 检查文件。
# true = 调试 Pecube.in 或单次最终验证时可临时开启。
run_test = false

# run_vtk：是否额外执行 Vtk 后处理。
# false = 默认，不生成 .vtk 文件，避免 GA 优化时每个候选解写出大量三维体数据。
# true = 只建议在单次最终解后处理或需要 ParaView 检查时临时开启。
run_vtk = false

# compute_loss：是否尝试计算热年代学 loss。
compute_loss = true

# sample_observations：真实热年代学样品 CSV。
# 推荐直接使用 Pecube 原生宽表 CSV；程序会原样检查并写入 Pecube project。
# 推荐表头：
#   SAMPLE,LON,LAT,HEIGHT,AHE,DAHE,AFT,DAFT,ZHE,DZHE,ZFT,DZFT
# 示例：
#   S01,103.64,31.38,3901,2.4,0.3,5.8,0.8,7.1,1.0,18.3,2.1
#   S01_AHE_2,103.64,31.38,3901,2.7,0.4,,,,,,
# LON/LAT 默认是真实经纬度，HEIGHT 单位为 m，所有年龄和误差单位为 Ma。
# 如果同一样品同一体系有多个年龄，建议拆成多行并给不同 SAMPLE 名称，例如 S01_AHE_1、S01_AHE_2。
# 旧版 long-table CSV 仍兼容：sample_id,lon,lat,elevation,system,observed_age,sigma。
# observation_coordinate_system = geographic 时，lon/lat 使用真实经纬度。
# observation_coordinate_system = projected 或 dem_crs 时，x/y 使用 DEM 投影坐标，程序会自动转成经纬度。
# observation_coordinate_system = pecube_output 时，x/y 使用 Pecube 输出坐标，范围由 lon0/lat0/dlon/dlat 和网格大小决定。
# observation_coordinate_system = grid_index 时，x/y 使用 DEM 行列网格坐标，程序会转换为 Pecube 输出坐标。
# 如果不想启用 Pecube 热年代学约束，改成 none。
sample_observations = ./demo/data/demo1/demo_thermo_samples.csv

# spatial_grid：Pecube 网格坐标来源。
# auto/dem = 从输入 DEM 的 CRS 和 transform 自动推导 lon0/lat0/dlon/dlat。
# manual = 使用下面手动填写的 lon0/lat0/dlon/dlat。
spatial_grid = auto

# observation_coordinate_system：样品 CSV 的 x/y 坐标含义。
# geographic = lon/lat 真实经纬度；projected/dem_crs = DEM 投影坐标；grid_index = DEM 网格索引；pecube_output = Pecube 输出坐标。
observation_coordinate_system = geographic

# observation_crs：样品坐标 CRS。
# auto/geographic 默认等同 EPSG:4326；如果样品 x/y 是其他投影坐标，可写 EPSG:xxxx。
observation_crs = EPSG:4326

# run_every：GA objective 每评价多少个候选解运行一次 Pecube。
# 1 表示每个候选解都运行；demo 为了展示完整链路保持 1，正式大规模搜索可调大。
run_every = 1

# max_evaluations：最多运行多少次 Pecube；0 表示不限制。
# demo 设为 0 表示不限制，让每个候选解都真实经过 Pecube 评价，能看到有意义的热年代学约束曲线。
max_evaluations = 0

# fail_strategy：Pecube 失败时如何处理。
# penalty = 记录失败上下文并给 thermo_loss 一个惩罚值；raise = 直接停止并报错。
fail_strategy = penalty

# penalty_loss：fail_strategy = penalty 或跳过 Pecube 评价时使用的热年代学惩罚 loss。
# 应高于正常 normalized RMSE，避免未验证候选解在 GA 中占优。
penalty_loss = 100.0

# shape/time_steps：pecube_coupled smoke demo 的轻量网格和时间序列步数。
shape = 21,21
time_steps = 2

# total_time_myr：Pecube 热史时间窗，单位 Ma，必须和 [Model] time_total 对齐。
# 例如 [Model] time_total = 2e6 年时，这里应写 2.0；time_total = 10e6 年时，这里应写 10.0。
# 若二者不一致，FastScape 的地形/隆升历史和 Pecube 的热史时间轴会错配，程序会直接提示配置错误。
total_time_myr = 2.0

# velocity_km_per_myr：可选的 Pecube 全域额外速度场，单位 km/Myr。
# 默认不会启用，避免和 FastScape/GA 写出的 uplift0,uplift1... 网格重复施加。
# 只有 include_uniform_velocity_field = true 时才会写入 Pecube 的 npoint=-1 速度场。
velocity_km_per_myr = 1.0
include_uniform_velocity_field = false

# thickness：Pecube 热模型厚度，单位 km。
thickness = 35.0

# nz：Pecube 垂向热模型节点数。
nz = 21

# thermal_diffusivity：热扩散率，使用 Pecube 原生单位 km^2/Myr。
thermal_diffusivity = 25.0

# basal_temperature：模型底部温度，单位摄氏度。
basal_temperature = 700.0

# sea_level_temperature / lapse_rate：自动生成 temp0,temp1... 地表温度场。
# 公式：surface_temp = sea_level_temperature - lapse_rate * topography_km。
# lapse_rate 使用正数，表示海拔越高地表越冷；若你有显式温度序列，可在 Python API 层传入 temperature_series 覆盖它。
sea_level_temperature = 15.0
lapse_rate = 6.5

# heat_production：体积生热参数，使用 Pecube 原生输入单位；demo 保持 0。
heat_production = 0.0

# erosional_time_scale：Pecube 原生侵蚀时间尺度参数；当前 FastScape 已提供地形历史，demo 保持 0。
erosional_time_scale = 0.0

# save_ptt_paths：是否保存 Pecube P-T-t 路径；会明显增加输出量，demo 默认关闭。
save_ptt_paths = false

# lon0/lat0/dlon/dlat：Pecube 网格坐标；spatial_grid=auto 时会由 DEM 自动覆盖这些值。
lon0 = 0.0
lat0 = 0.0

# nskip：Pecube 读取 DEM/topo 网格时的水平抽样步长。
# 1 = 使用所有格点，最精细但最慢、输出最大。
# 4 = 默认优化搜索设置，只用每 4 个格点，显著减少 Pecube 中间数据和磁盘占用。
# 如果做最终高精度单次验证，可临时调回 1 或 2。
nskip = 4

dlon = 0.01
dlat = 0.01

[Fitness]
# use_lpips：是否启用 LPIPS 深度感知相似度。
# 默认开启。安装脚本会预先初始化 LPIPS Alex 模型，避免第一次运行实验时才下载。
# 如果只想做极轻量的基础诊断，可以临时改为 false。
use_lpips = true

# terrain_loss_weight：地形 loss 权重。
# terrain_loss 会被限制在 0-1。
terrain_loss_weight = 1.0

# thermo_loss_weight：Pecube 热年代学 loss 权重。
# 如果 [Pecube] 关闭或 sample_observations = none，此项不会参与计算。
thermo_loss_weight = 0.2

# thermo_loss_scale：把热年代学原始 normalized RMSE 平滑映射到 0-1 的尺度。
# thermo_loss = thermo_loss_raw / (thermo_loss_raw + thermo_loss_scale)。
# 这个公式不会把大于 scale 的候选全部截断成 1，因此热约束差异能进入 GA 排序。
# total_loss = 加权平均后的 0-1 综合 loss，不再直接相加不同量纲。
thermo_loss_scale = 5.0

# thermo_sigma_min：热年代学 loss 使用的最小有效 1σ 误差，单位 Ma。
# effective_sigma = max(sigma, thermo_sigma_min, observed_age * thermo_sigma_relative)。
# 这样 2 Ma 左右的年轻年龄不会因为 0.1 Ma 的实验误差在优化中获得不成比例的权重。
thermo_sigma_min = 0.5

# thermo_sigma_relative：热年代学 loss 的相对误差下限。
# 例如 0.1 表示至少按年龄的 10% 作为有效 1σ。
thermo_sigma_relative = 0.1

[Synthetic]
# pattern：合成隆升场形态。
# simple 最快；medium/complex 更复杂，适合正式验证。
pattern = simple

# shape：合成实验网格大小。
# demo 64,64 可以快速验证；正式实验可改成 100,100 或更大。
shape = 64,64

[KSensitivity]
# k_values：要比较的 scale_factor/K 列表。
# demo 比较 4 和 8；正式实验可写成 3,5,7,10,15。
k_values = 4,8

# pattern：敏感性实验使用的合成隆升场形态。
# demo 用 simple，正式实验可改 medium 或 complex。
pattern = simple

# shape：敏感性实验网格大小。
# demo 64,64；正式实验可逐步增大。
shape = 64,64
