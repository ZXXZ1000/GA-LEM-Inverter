# =============================================================================
# GA-LEM-Inverter 主配置文件
#
# 普通用户只需要改这个文件，然后运行:
#   python runner.py
#
# 默认配置使用 demo/data/demo_dem.tif，可以在刚安装后直接跑通。
# 正式研究时，优先修改 [Run] mode、[Data] 输入路径和 [Optimization] 规模。
# =============================================================================

[Run]
# mode：选择要运行的实验。
# main = 真实 DEM 主优化反演；synthetic = 合成地形验证；k_sensitivity = K/scale_factor 敏感性实验。
# demo 默认用 main，验证真实 DEM 入口能直接跑起来。
mode = main

# preset：运行预设标记，只用于诊断和 summary，不改变算法。
# demo 表示轻量演示；quick 表示快速测试；research 表示正式实验。
preset = demo

[Data]
# terrain_path：main 模式必填，输入 DEM 栅格路径，支持 .tif/.tiff/.npy。
# demo 默认指向仓库自带的 64x64 示例 DEM；正式研究时改成自己的 DEM。
terrain_path = ./demo/data/demo_dem.tif

# fault_shp_path：可选，断层线 Shapefile 路径。
# 有断层文件时会沿断层设置更高侵蚀系数；留空/none/skip 时使用均一侵蚀系数场。
fault_shp_path = none

# study_area_shp_path：可选，研究区边界 Shapefile 路径。
# 有研究区文件时会裁剪 DEM 并计算旋转角；留空/none/skip 时使用 DEM 全域且不旋转。
study_area_shp_path = none

# output_path：所有实验的输出基目录。
# 每次运行会自动新建 0001_时间戳_mode 目录，里面分 figures/arrays/metrics/logs。
# demo 默认把运行结果收在 demo/outputs/，和 demo 输入数据放在同一个 demo 文件夹下。
output_path = ./demo/outputs

[Model]
# k_sp_value：基础河流侵蚀系数，控制非断层区域的河流下切强度。
# demo 值与内置 DEM 的生成尺度匹配；正式研究需要结合区域岩性、时间尺度和文献校准。
k_sp_value = 6.92e-6

# ksp_fault：断层带侵蚀系数。
# 只有 fault_shp_path 和 study_area_shp_path 都有效时才用于断层增强；无断层 demo 会自动跳过。
ksp_fault = 2e-5

# d_diff_value：坡面扩散系数，控制坡面平滑/扩散强度。
# demo 建议保留；正式实验可做敏感性测试。
d_diff_value = 19.2

# boundary_status：Fastscape 边界条件。
# demo 和多数首次实验建议 fixed_value。
boundary_status = fixed_value

# area_exp：河流侵蚀定律中的汇水面积指数 m。
# 不熟悉时保留默认值。
area_exp = 0.42

# slope_exp：河流侵蚀定律中的坡度指数 n。
# 不熟悉时保留默认值。
slope_exp = 1

# time_total：总模拟时间，单位年。
# demo 用 2e5，保证结果有地形演化过程但运行较快；正式实验通常调到百万年至千万年量级。
time_total = 2e5

# spacing：synthetic 和 k_sensitivity 使用的网格间距，单位米。
# main 模式会优先从 DEM 读取真实像元大小。
spacing = 900

[Optimization]
# scale_factor：隆升场降维因子，也就是 K。
# 64x64 DEM 配合 8 会优化 8x8 个隆升变量；越大越快但空间细节越少。
scale_factor = 8

# ratio：main 模式 DEM 重采样比例，范围 0-1。
# demo 保持 1.0；正式大 DEM 可先设 0.25-0.5 做快速试算。
ratio = 1.0

# target_crs：目标投影坐标系。
# 输入 DEM/shapefile CRS 不一致时，程序会尝试重投影到这个坐标系。
target_crs = EPSG:32648

# smooth_sigma：DEM 平滑系数。
# 数值越大，地形细节越平滑；demo 建议保留。
smooth_sigma = 2

# population_size：遗传算法种群大小。
# demo 用 6，能看到优化过程；正式实验建议从 30-100 逐步增加。
population_size = 6

# max_iterations：最大迭代代数。
# demo 用 5；正式实验建议从 50-200 逐步增加。
max_iterations = 5

# cross_probability：交叉概率，控制父代组合生成新个体的比例。
# 不熟悉时保留默认值。
cross_probability = 0.7

# mutation_probability：变异概率，控制随机扰动强度。
# 不熟悉时保留默认值。
mutation_probability = 0.05

# uplift_min：隆升率搜索下界，单位 mm/yr。
# 正式研究应按区域地质背景设置。
uplift_min = 0

# uplift_max：隆升率搜索上界，单位 mm/yr。
# 正式研究应按区域地质背景设置。
uplift_max = 8

# n_jobs：并行任务数。
# Windows demo 建议 1，避免首次多进程问题；正式实验可设为 CPU 核心数，-1 表示使用所有核心。
n_jobs = 1

# decay_rate：种群衰减率。
# demo 用 1.0 表示不衰减；正式实验可设 0.95-0.98 加速后期收敛。
decay_rate = 1.0

# min_population_size：衰减后的最小种群大小，不能大于 population_size。
# demo 建议保留。
min_population_size = 4

# patience：早停耐心值，连续多少代没有改进后停止。
# demo 较小；正式实验可调大。
patience = 3

# random_seed：随机种子。
# demo 固定为 42，保证不同电脑首次结果相近；正式实验可换不同整数做重复实验。
random_seed = 42

[Fitness]
# use_lpips：是否启用 LPIPS 深度感知相似度。
# demo 设为 false，避免首次运行加载深度模型；正式论文级实验需要时可改为 true。
use_lpips = false

[Synthetic]
# pattern：合成隆升场形态。
# simple 最快；medium/complex 更复杂，适合正式验证。
pattern = simple

# shape：合成实验网格大小。
# demo 64,64 可以快速验证；正式实验可改成 100,100 或更大。
shape = 64,64

[KSensitivity]
# k_values：要比较的 scale_factor/K 列表。
# demo 比较 4 和 8；正式实验可写成 3,5,7,10,15。
k_values = 4,8

# pattern：敏感性实验使用的合成隆升场形态。
# demo 用 simple，正式实验可改 medium 或 complex。
pattern = simple

# shape：敏感性实验网格大小。
# demo 64,64；正式实验可逐步增大。
shape = 64,64
