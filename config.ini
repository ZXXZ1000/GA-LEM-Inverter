# GA-LEM-Inverter 默认配置
#
# 这个文件默认指向仓库自带的轻量 DEM demo。安装环境后，用户不需要改任何内容，
# 直接运行 python main.py 即可生成一次完整的示例结果。
#
# 做正式研究时，优先改 [Paths] 里的数据路径，再根据数据大小逐步调大
# [GeneticAlgorithm] 和 [Preprocessing] 参数。

[Paths]
# terrain_path：必填。输入 DEM 栅格路径，支持 .tif/.tiff/.npy。
# 默认 demo_dem.tif 是 64x64 的轻量示例，用于验证程序能跑通。
terrain_path = ./demo_data/demo_dem.tif

# fault_shp_path：可选。断层线 Shapefile 路径。
# 有断层文件时，程序会沿断层叠加较高侵蚀系数；留空/none/skip 时使用均一侵蚀系数场。
fault_shp_path = ./demo_data/demo_fault.shp

# study_area_shp_path：可选。研究区边界 Shapefile 路径。
# 有研究区文件时，程序会裁剪 DEM 并按研究区主方向计算旋转角度；留空/none/skip 时使用 DEM 全域且不旋转。
study_area_shp_path = ./demo_data/demo_study_area.shp

# output_path：必填。结果输出目录。
# 每次运行会自动在该目录下创建 Expt_时间戳 子目录，保存日志、图像和数组结果。
output_path = ./demo_outputs

[Model]
# k_sp_value：基础河流侵蚀系数，控制非断层区域的河流下切强度。
# 数值越大，模型地形演化越快；正式实验应结合区域岩性和时间尺度校准。
k_sp_value = 6.92e-6

# ksp_fault：断层带额外侵蚀系数。
# 只有 fault_shp_path 和 study_area_shp_path 都有效时才会叠加；无断层 demo 会自动跳过。
ksp_fault = 2e-5

# d_diff_value：坡面扩散系数，控制坡面平滑/扩散强度。
d_diff_value = 19.2

# boundary_status：Fastscape 边界条件。
# demo 使用 fixed_value；正式实验一般也从 fixed_value 开始测试。
boundary_status = fixed_value

# area_exp：河流侵蚀定律中的汇水面积指数 m。
area_exp = 0.42

# slope_exp：河流侵蚀定律中的坡度指数 n。
slope_exp = 1

# time_total：总模拟时间，单位年。
# demo 用 2e5；该值与内置 demo_dem.tif 的正演生成参数一致。
# 正式研究应按地质时间尺度和隆升率重新设置，通常为百万年至千万年量级。
time_total = 2e5

[GeneticAlgorithm]
# ga_pop_size：遗传算法种群大小。
# demo 用 6，能产生有过程的优化和可展示的地形；正式实验建议从 30-100 逐步增加。
ga_pop_size = 6

# ga_max_iter：最大迭代代数。
# demo 用 5，兼顾速度和可展示结果；正式实验建议从 50-200 逐步增加。
ga_max_iter = 5

# ga_prob_cross：交叉概率，控制父代组合生成新个体的比例。
ga_prob_cross = 0.7

# ga_prob_mut：变异概率，控制随机扰动强度。
ga_prob_mut = 0.05

# lb：隆升率搜索下界，单位 mm/yr。
lb = 0

# ub：隆升率搜索上界，单位 mm/yr。
ub = 8

# n_jobs：并行任务数。
# demo 固定 1，避免 Windows 首次运行多进程问题；正式实验可设为 CPU 核心数，-1 表示使用所有核心。
n_jobs = 1

# decay_rate：种群衰减率。
# demo 用 1.0 表示不衰减；正式实验可设 0.95-0.98 加速后期收敛。
decay_rate = 1.0

# min_size_pop：衰减后的最小种群大小，不能大于 ga_pop_size。
min_size_pop = 4

# patience：早停耐心值，连续多少代没有改进后停止。
patience = 3

# random_seed：随机种子。
# demo 固定为 42，保证不同电脑首次运行得到相近结果；正式实验可改成不同整数做重复实验。
random_seed = 42

[Fitness]
# use_lpips：是否启用 LPIPS 深度感知相似度。
# demo 设为 false，避免首次运行加载深度模型；正式实验需要感知相似性时可改为 true。
use_lpips = false

[Preprocessing]
# smooth_sigma：DEM 平滑系数。
# 数值越大，地形细节越平滑；demo 保持 2。
smooth_sigma = 2

# scale_factor：隆升场降维因子。
# 64x64 DEM 配合 8 会优化 8x8 个隆升变量；数值越大越快，但空间细节越少。
scale_factor = 8

# ratio：DEM 重采样比例，范围 0-1。
# demo 用 1.0 保持 64x64；正式大 DEM 可先设 0.25-0.5 降低计算量。
ratio = 1.0

# target_crs：目标投影坐标系。
# 输入 DEM/shapefile CRS 不一致时，程序会尝试重投影到该坐标系。
target_crs = EPSG:32648
